  /* Mide el hueco de la vista previa y calcula el factor de encaje automático. */
  (function encajarHojas() {
    const zona = document.querySelector('#preview');
    if (!zona) return;
    const ANCHO_HOJA = 816;
    let puesto = '';
    window.aplicarEncajeAutomatico = () => {
      const scrollArea = document.querySelector('#preview-scroll-area') || zona;
      const estilo = getComputedStyle(scrollArea);
      const hueco = scrollArea.clientWidth
        - parseFloat(estilo.paddingLeft || 0) - parseFloat(estilo.paddingRight || 0) - 48;
      if (hueco <= 0) return;
      const factor = Math.min(1, hueco / ANCHO_HOJA).toFixed(3);
      if (factor === puesto) return;
      puesto = factor;
      zona.style.setProperty('--encaje-hoja', factor);
    };
    window.aplicarEncajeAutomatico();
    if (window.ResizeObserver) {
      const targetObs = document.querySelector('#preview-scroll-area') || zona;
      new ResizeObserver(window.aplicarEncajeAutomatico).observe(targetObs);
    }
  })();

  /* ====================== ESCRIBIR A MANO SOBRE LA HOJA ======================
     Firmar una hoja de llamado, rayar el diagrama en el set, tachar un bloque
     que no se grabó. Es lo que se hace con las hojas de producción de verdad, y
     hasta ahora obligaba a imprimirlas primero.

     LA REGLA QUE HACE QUE SE SIENTA BIEN EN UN iPAD: el Apple Pencil escribe
     SIEMPRE, y el dedo nunca. No hay modo que encender ni botón que recordar —
     tocas con el lápiz y escribes, tocas con el dedo y la hoja se desplaza,
     igual que en un cuaderno. WebKit lo permite porque cada evento dice con qué
     lo hiciste (`pointerType`), y además ya trae el rechazo de palma: con el
     lápiz apoyado, el toque de la mano no llega.

     En el Mac no hay lápiz, así que ahí sí hace falta encender "Modo escritura"
     para dibujar con el ratón. Misma capa, misma tinta, mismo archivo.

     SE GUARDA EN EL PROYECTO (`cfg.anotaciones`), no en el navegador: la firma
     de una hoja de llamado es parte del proyecto y tiene que viajar con el
     .ptv, verse en el iPad si se hizo en el Mac, y seguir ahí mañana. */
  /* ====================== ESCRIBIR A MANO SOBRE LA HOJA ======================
     Apple PencilKit Markup Engine con Matriz Inversa Nativa SVG W3C y
     Barra de Herramientas Horizontal macOS Preview (GoF State, GoF Command). */
  (function tintaAMano() {
    const COLORES = ['#15233D', '#1D6FD1', '#D92E2E', '#E5A400', '#2E7D32', '#FFFFFF'];
    const GROSORES = [
      { id: 'fino', label: '1.5 pt', w: 1.6 },
      { id: 'medio', label: '3.5 pt', w: 3.5 },
      { id: 'marca', label: '8.0 pt', w: 8.0 },
    ];
    let color = COLORES[0];
    let grosor = GROSORES[1];
    let herramienta = 'pen'; // 'pen' | 'highlighter' | 'eraser' | 'stamp'
    let modoEscritura = false;
    window._escribiendoAhora = false;

    const anotaciones = () => (cfg && (cfg.anotaciones = cfg.anotaciones || {})) || {};

    let reloj = 0;
    function guardar() {
      clearTimeout(reloj);
      reloj = setTimeout(() => {
        if (cfg) parent.postMessage({ type: 'producciontv:infografia-state', cfg }, '*');
      }, 700);
    }

    // GoF Command Pattern para historial reversible de trazos y sellos
    const historial = {
      pilaUndo: [],
      pilaRedo: [],
      ejecutar(cmd) {
        cmd.ejecutar();
        this.pilaUndo.push(cmd);
        this.pilaRedo = [];
        this.actualizarUI();
        guardar();
      },
      deshacer() {
        if (!this.pilaUndo.length) return;
        const cmd = this.pilaUndo.pop();
        cmd.deshacer();
        this.pilaRedo.push(cmd);
        this.actualizarUI();
        guardar();
      },
      rehacer() {
        if (!this.pilaRedo.length) return;
        const cmd = this.pilaRedo.pop();
        cmd.ejecutar();
        this.pilaUndo.push(cmd);
        this.actualizarUI();
        guardar();
      },
      actualizarUI() {
        const uBtn = document.querySelector('#markup-undo');
        const rBtn = document.querySelector('#markup-redo');
        if (uBtn) uBtn.disabled = !this.pilaUndo.length;
        if (rBtn) rBtn.disabled = !this.pilaRedo.length;
      }
    };

    function caminos(trazo) {
      const pts = trazo.t || [];
      if (pts.length < 2) {
        const [x, y, pr] = pts[0] || [0, 0, .5];
        return [{ d: `M${x} ${y} l0.1 0`, w: trazo.w * (0.5 + pr) }];
      }
      const out = [];
      let ini = 0;
      for (let i = 1; i < pts.length; i++) {
        const cambio = Math.abs(pts[i][2] - pts[ini][2]) > 0.18;
        if (i - ini >= 8 || cambio || i === pts.length - 1) {
          const tramo = pts.slice(ini, i + 1);
          const media = tramo.reduce((a, p) => a + p[2], 0) / tramo.length;
          out.push({
            d: 'M' + tramo.map((p) => `${p[0]} ${p[1]}`).join(' L'),
            w: Math.max(0.5, trazo.w * (0.5 + media)),
          });
          ini = i - 1 >= 0 ? i - 1 : i;
        }
      }
      return out;
    }

    function pintar(svg, trazos) {
      svg.innerHTML = (trazos || []).map((t) => {
        if (t.tipo === 'sello') {
          const sx = t.x - 110;
          const sy = t.y - 36;
          return `
            <g class="tinta-stamp" transform="translate(${sx}, ${sy})" style="cursor:default">
              <rect x="0" y="0" width="220" height="72" rx="8" fill="rgba(255,255,255,0.94)" stroke="${t.c}" stroke-width="2.5" stroke-dasharray="8 3" opacity="0.96"/>
              <rect x="3" y="3" width="214" height="66" rx="6" fill="none" stroke="${t.c}" stroke-width="1" opacity="0.5"/>
              <circle cx="28" cy="36" r="14" fill="${t.c}" opacity="0.14"/>
              <circle cx="28" cy="36" r="13" fill="none" stroke="${t.c}" stroke-width="1.6"/>
              <path d="M22 36 l4 4 l8 -9" fill="none" stroke="${t.c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <text x="48" y="24" fill="${t.c}" font-size="10.5" font-weight="900" letter-spacing="1.2" font-family="-apple-system,BlinkMacSystemFont,sans-serif">${esc(t.titulo)}</text>
              <text x="48" y="38" fill="${t.c}" font-size="8" font-weight="700" letter-spacing="0.8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" opacity="0.9">${esc(t.sub)}</text>
              <text x="48" y="51" fill="#475569" font-size="7.5" font-weight="600" font-family="ui-monospace,Menlo,monospace">${esc(t.fecha)} · ${esc(t.hora)}</text>
              <text x="48" y="62" fill="#64748B" font-size="7" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">${esc(t.proyecto)}</text>
            </g>`;
        }
        const esHl = t.k === 'highlighter' || t.c === '#E5A400';
        const opacidad = esHl ? '0.42' : '1';
        const remate = esHl ? 'square' : 'round';
        const mezcla = esHl ? 'mix-blend-mode:multiply;' : '';
        return caminos(t).map((c) =>
          `<path d="${c.d}" fill="none" stroke="${t.c}" stroke-width="${c.w.toFixed(2)}" stroke-linecap="${remate}" stroke-linejoin="round" stroke-opacity="${opacidad}" style="${mezcla}"/>`
        ).join('');
      }).join('');
    }

    function actualizarCursores() {
      document.querySelectorAll('.tinta').forEach((s) => {
        s.classList.toggle('escribiendo', modoEscritura && (herramienta === 'pen' || herramienta === 'highlighter'));
        s.classList.toggle('borrando', modoEscritura && herramienta === 'eraser');
        if (herramienta === 'stamp' && modoEscritura) {
          s.style.cursor = 'crosshair';
        } else if (!modoEscritura) {
          s.style.cursor = '';
        }
      });
    }

    // Enganchar una hoja física al motor de tinta
    function engancharPagina(pagina) {
      const nombre = pagina.dataset.name;
      if (!nombre) return;
      const w = 816;
      const rect = pagina.getBoundingClientRect();
      const h = (rect.width > 0) ? Math.round(816 * (rect.height / rect.width)) : (pagina.offsetHeight || 1056);

      let svg = pagina.querySelector('.tinta');
      if (!svg) {
        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'tinta');
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.setAttribute('preserveAspectRatio', 'none');
        pagina.appendChild(svg);
      } else {
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      }

      let trazos = anotaciones()[nombre] || [];
      pintar(svg, trazos);
      actualizarCursores();

      let actual = null;

      // Transformación Matemática Nativa SVG W3C (0px de desfase)
      const punto = (e) => {
        if (svg.getScreenCTM) {
          const pt = svg.createSVGPoint();
          pt.x = e.clientX;
          pt.y = e.clientY;
          const ctm = svg.getScreenCTM();
          if (ctm) {
            const p = pt.matrixTransform(ctm.inverse());
            if (Number.isFinite(p.x) && Number.isFinite(p.y)) {
              return [
                +Math.max(0, Math.min(816, p.x)).toFixed(1),
                +Math.max(0, Math.min(h, p.y)).toFixed(1),
                e.pressure > 0 ? e.pressure : 0.5,
              ];
            }
          }
        }
        const r = svg.getBoundingClientRect();
        const rw = r.width || 1;
        const rh = r.height || 1;
        return [
          +Math.max(0, Math.min(816, ((e.clientX - r.left) / rw) * 816)).toFixed(1),
          +Math.max(0, Math.min(h, ((e.clientY - r.top) / rh) * h)).toFixed(1),
          e.pressure > 0 ? e.pressure : 0.5,
        ];
      };

      const puedeEscribir = (e) => e.pointerType === 'pen' || modoEscritura;

      const borrarCercanos = (p) => {
        const px = p[0], py = p[1];
        const inicial = trazos.length;
        const eliminados = [];
        trazos = trazos.filter((t) => {
          if (t.tipo === 'sello') {
            if (px >= t.x - 115 && px <= t.x + 115 && py >= t.y - 40 && py <= t.y + 40) {
              eliminados.push(t);
              return false;
            }
            return true;
          }
          for (const pt of (t.t || [])) {
            if (Math.hypot(pt[0] - px, pt[1] - py) < (t.w * 2 + 12)) {
              eliminados.push(t);
              return false;
            }
          }
          return true;
        });
        if (trazos.length !== inicial) {
          anotaciones()[nombre] = trazos;
          pintar(svg, trazos);
          return eliminados;
        }
        return null;
      };

      let eliminadosEnArrastre = [];

      svg.addEventListener('pointerdown', (e) => {
        if (!puedeEscribir(e)) return;
        e.preventDefault();
        svg.setPointerCapture(e.pointerId);
        window._escribiendoAhora = true;

        const p = punto(e);
        if (herramienta === 'eraser') {
          eliminadosEnArrastre = [];
          const del = borrarCercanos(p);
          if (del) eliminadosEnArrastre.push(...del);
          return;
        }

        if (herramienta === 'stamp') {
          const colorSello = color === '#FFFFFF' ? '#1D6FD1' : color;
          const sello = {
            tipo: 'sello',
            c: colorSello,
            x: Math.round(p[0]),
            y: Math.round(p[1]),
            titulo: 'APROBADO PARA AIRE',
            sub: 'VO.BO. PRODUCCIÓN TV',
            fecha: new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase(),
            hora: new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }),
            proyecto: (trunc(projectName || cfg.titulo || 'PRODUCCIÓN TV', 24)).toUpperCase()
          };
          const cmd = {
            nombre,
            trazo: sello,
            ejecutar() {
              const list = anotaciones()[nombre] = anotaciones()[nombre] || [];
              if (!list.includes(this.trazo)) list.push(this.trazo);
              pagina._tinta && pagina._tinta.repintar();
            },
            deshacer() {
              const list = anotaciones()[nombre] || [];
              const idx = list.indexOf(this.trazo);
              if (idx >= 0) list.splice(idx, 1);
              pagina._tinta && pagina._tinta.repintar();
            }
          };
          historial.ejecutar(cmd);
          window._escribiendoAhora = false;
          return;
        }

        const esHl = herramienta === 'highlighter';
        const wTrazo = esHl ? Math.max(14, grosor.w * 3.5) : grosor.w;
        actual = { c: color, w: wTrazo, k: herramienta, t: [p] };
        trazos.push(actual);
        anotaciones()[nombre] = trazos;
        pintar(svg, trazos);
      });

      svg.addEventListener('pointermove', (e) => {
        if (!window._escribiendoAhora) return;
        e.preventDefault();
        const brutos = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const b of (brutos.length ? brutos : [e])) {
          const p = punto(b);
          if (herramienta === 'eraser') {
            const del = borrarCercanos(p);
            if (del) eliminadosEnArrastre.push(...del);
          } else if (actual) {
            const u = actual.t[actual.t.length - 1];
            if (u && Math.hypot(p[0] - u[0], p[1] - u[1]) < 1.2) continue;
            actual.t.push(p);
          }
        }
        if (actual) pintar(svg, trazos);
      });

      const finalizarTrazo = () => {
        if (!window._escribiendoAhora) return;
        window._escribiendoAhora = false;
        if (herramienta === 'eraser' && eliminadosEnArrastre.length) {
          const borrados = [...eliminadosEnArrastre];
          eliminadosEnArrastre = [];
          const cmd = {
            nombre,
            borrados,
            ejecutar() {
              const list = anotaciones()[nombre] || [];
              anotaciones()[nombre] = list.filter((t) => !this.borrados.includes(t));
              pagina._tinta && pagina._tinta.repintar();
            },
            deshacer() {
              const list = anotaciones()[nombre] = anotaciones()[nombre] || [];
              this.borrados.forEach((t) => { if (!list.includes(t)) list.push(t); });
              pagina._tinta && pagina._tinta.repintar();
            }
          };
          historial.pilaUndo.push(cmd);
          historial.pilaRedo = [];
          historial.actualizarUI();
          guardar();
        } else if (actual) {
          const trazoCreado = actual;
          actual = null;
          const cmd = {
            nombre,
            trazo: trazoCreado,
            ejecutar() {
              const list = anotaciones()[nombre] = anotaciones()[nombre] || [];
              if (!list.includes(this.trazo)) list.push(this.trazo);
              pagina._tinta && pagina._tinta.repintar();
            },
            deshacer() {
              const list = anotaciones()[nombre] || [];
              const idx = list.indexOf(this.trazo);
              if (idx >= 0) list.splice(idx, 1);
              pagina._tinta && pagina._tinta.repintar();
            }
          };
          historial.pilaUndo.push(cmd);
          historial.pilaRedo = [];
          historial.actualizarUI();
          guardar();
        }
      };

      svg.addEventListener('pointerup', finalizarTrazo);
      svg.addEventListener('pointercancel', finalizarTrazo);
      svg.addEventListener('pointerleave', finalizarTrazo);

      pagina._tinta = {
        svg,
        nombre,
        trazos: () => anotaciones()[nombre] || [],
        repintar: () => { trazos = anotaciones()[nombre] || []; pintar(svg, trazos); }
      };
    }

    window.engancharTinta = () => {
      document.querySelectorAll('.export-page').forEach(engancharPagina);
    };

    window.tintaModo = (on) => {
      modoEscritura = !!on;
      actualizarCursores();
    };

    window.tintaHerramienta = (h) => {
      herramienta = h;
      actualizarCursores();
    };

    window.tintaColor = (c) => { color = c; };
    window.tintaGrosor = (id) => { grosor = GROSORES.find((g) => g.id === id) || grosor; };

    window.tintaDeshacer = () => historial.deshacer();
    window.tintaRehacer = () => historial.rehacer();

    window.tintaBorrarPagina = () => {
      const curIdx = (PreviewController.currentPage || 1) - 1;
      const paginas = [...document.querySelectorAll('.export-page')];
      const targetPage = paginas[curIdx] || paginas[0];
      if (!targetPage) return;
      const nombre = targetPage.dataset.name;
      const viejos = [...(anotaciones()[nombre] || [])];
      if (!viejos.length) return;
      const cmd = {
        nombre,
        viejos,
        ejecutar() {
          anotaciones()[nombre] = [];
          targetPage._tinta?.repintar();
        },
        deshacer() {
          anotaciones()[nombre] = [...this.viejos];
          targetPage._tinta?.repintar();
        }
      };
      historial.ejecutar(cmd);
    };

    window.TINTA_COLORES = COLORES;
    window.TINTA_GROSORES = GROSORES;
  })();

  /* ==========================================================================
   * CONTROLADOR DE LA BARRA DE MARCADO APPLE PREVIEW (macOS Markup Toolbar)
   * ========================================================================== */
  (function markupBarController() {
    const bar = document.querySelector('#doc-markup-bar');
    if (!bar || !window.TINTA_COLORES) return;

    let toolActual = 'pen';
    let colorActual = window.TINTA_COLORES[0];
    let grosorActual = 'medio';
    let modoManual = true; // Habilitado por defecto en macOS para que dibujar con ratón/trackpad sea inmediato

    // Activar modo manual inicialmente en desktop
    window.tintaModo(modoManual);
    const drawModeBtn = document.querySelector('#markup-draw-mode');
    if (drawModeBtn) drawModeBtn.classList.toggle('active', modoManual);

    // Herramientas (Pluma, Resaltador, Borrador, Sello)
    bar.querySelectorAll('[data-tool]').forEach((btn) => {
      btn.onclick = () => {
        bar.querySelectorAll('[data-tool]').forEach((b) => b.classList.toggle('active', b === btn));
        toolActual = btn.dataset.tool;
        window.tintaHerramienta(toolActual);
      };
    });

    // Colores
    const colorsCont = document.querySelector('#markup-colors');
    if (colorsCont) {
      colorsCont.innerHTML = window.TINTA_COLORES.map((c) =>
        `<button class="markup-color-dot ${c === colorActual ? 'active' : ''}" data-color="${c}" style="background:${c}" title="Color ${c}"></button>`
      ).join('');
      colorsCont.querySelectorAll('[data-color]').forEach((btn) => {
        btn.onclick = () => {
          colorsCont.querySelectorAll('[data-color]').forEach((b) => b.classList.toggle('active', b === btn));
          colorActual = btn.dataset.color;
          window.tintaColor(colorActual);
        };
      });
    }

    // Grosores
    const widthsCont = document.querySelector('#markup-widths');
    if (widthsCont) {
      widthsCont.innerHTML = window.TINTA_GROSORES.map((g) =>
        `<button class="markup-width-btn ${g.id === grosorActual ? 'active' : ''}" data-grosor="${g.id}" title="Grosor ${g.label}">${g.label}</button>`
      ).join('');
      widthsCont.querySelectorAll('[data-grosor]').forEach((btn) => {
        btn.onclick = () => {
          widthsCont.querySelectorAll('[data-grosor]').forEach((b) => b.classList.toggle('active', b === btn));
          grosorActual = btn.dataset.grosor;
          window.tintaGrosor(grosorActual);
        };
      });
    }

    // Acciones Undo / Redo / Clear
    document.querySelector('#markup-undo')?.addEventListener('click', () => window.tintaDeshacer());
    document.querySelector('#markup-redo')?.addEventListener('click', () => window.tintaRehacer());
    document.querySelector('#markup-clear')?.addEventListener('click', () => {
      if (confirm('¿Limpiar las anotaciones de la página activa?')) {
        window.tintaBorrarPagina();
      }
    });

    // Modo dibujo manual (ratón o dedo)
    if (drawModeBtn) {
      drawModeBtn.onclick = () => {
        modoManual = !modoManual;
        drawModeBtn.classList.toggle('active', modoManual);
        window.tintaModo(modoManual);
      };
    }

    // Atajos de teclado Apple Markup
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
      if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        window.tintaDeshacer();
      } else if ((e.metaKey || e.ctrlKey) && (e.shiftKey && (e.key === 'z' || e.key === 'Z') || e.key === 'y' || e.key === 'Y')) {
        e.preventDefault();
        window.tintaRehacer();
      } else if (e.key === 'p' || e.key === 'P') {
        document.querySelector('#tool-pen')?.click();
      } else if (e.key === 'h' || e.key === 'H') {
        document.querySelector('#tool-highlighter')?.click();
      } else if (e.key === 'e' || e.key === 'E') {
        document.querySelector('#tool-eraser')?.click();
      } else if (e.key === 's' || e.key === 'S') {
        document.querySelector('#tool-stamp')?.click();
      }
    });
  })();

  /* ==========================================================================
   * CONTEXTO Y DESPACHO DE EXPORTACIÓN (GoF Strategy Context)
   * ========================================================================== */
  const ExportContext = {
    printDocument,
    exportEdl() {
      if (!window.PTVVisitors) return;
      const prodProject = new window.PTVVisitors.ProductionProject({ cfg, diagram, project, projectName });
      const edlContent = prodProject.accept(new window.PTVVisitors.EdlExportVisitor(cfg.fps || 30));
      parent.postMessage({
        type: 'producciontv:save-file',
        filename: `${slug(projectName || 'produccion')}.edl`,
        content: edlContent,
      }, '*');
    },
    exportCsv() {
      if (!window.PTVVisitors) return;
      const prodProject = new window.PTVVisitors.ProductionProject({ cfg, diagram, project, projectName });
      const csvContent = prodProject.accept(new window.PTVVisitors.CsvExportVisitor());
      parent.postMessage({
        type: 'producciontv:save-file',
        filename: `${slug(projectName || 'produccion')}-tablas.csv`,
        content: csvContent,
      }, '*');
    },
    exportPng() {
      parent.postMessage({ type: 'producciontv:export-pngs' }, '*');
    },
    exportPtv() {
      parent.postMessage({
        type: 'producciontv:save-file',
        filename: `${slug(projectName)}.ptv`,
        content: JSON.stringify({ project: project, infographic: cfg, diagram: diagram }, null, 2),
      }, '*');
    }
  };

  document.querySelector('#go').onclick = () => {
    if (!cfg) return;
    exportManager.execute(ExportContext);
  };

  window.addEventListener('message', (event) => {
    // El tema viaja del marco a la herramienta: son documentos distintos y
    // esta no hereda nada. Sin esto arrancaría siempre en claro.
    if (event.data?.type === 'producciontv:tema') {
      const t = event.data.tema;
      if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
      else delete document.documentElement.dataset.tema;
    }
    const data = event.data;
    if (data && data.type === 'producciontv:load-exportar') {
      const prevAnotaciones = cfg?.anotaciones;
      cfg = data.cfg || null;
      if (cfg && (!cfg.anotaciones || !Object.keys(cfg.anotaciones).length) && prevAnotaciones) {
        cfg.anotaciones = prevAnotaciones;
      }
      diagram = data.diagram || null;
      project = data.project || null;
      projectName = data.projectName || '';
      PreviewController.init();
      // Evitar destruir los trazos o reiniciar el DOM si el usuario está dibujando en este momento
      if (cfg && !window._escribiendoAhora) render();
    }
  });
})();
</script>
