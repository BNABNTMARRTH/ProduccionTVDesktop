<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guías imprimibles — Producción TV</title>
<link rel="stylesheet" href="../shared/sheets.css">
<style>
  /* Pantalla: previsualización sobre fondo oscuro. Impresión: solo las hojas. */
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#25313f;color:#15233D}
  .toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 16px;background:#16365F;color:#fff;box-shadow:0 4px 14px #0005}
  .toolbar strong{font-size:14px;letter-spacing:.5px;text-transform:uppercase}
  .toolbar label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer}
  .toolbar input[type=checkbox]{width:14px;height:14px;accent-color:#58a8ff}
  .toolbar input[type=number]{width:52px;border:1px solid #3a5a85;border-radius:6px;background:#0e2748;color:#fff;padding:4px 6px;font:inherit}
  .toolbar button{margin-left:auto;border:1px solid #4f89c8;background:#1d6fd1;color:#fff;border-radius:8px;padding:8px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .toolbar button:hover{background:#2d83e6}
  .toolbar .hint{font-size:11px;color:#a9c6e8}
  /* Las hojas se acomodan en tantas columnas como quepan: en una pantalla
     grande se ven varias a la vez en vez de una sola con aire a los lados. */
  .sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,820px),1fr));justify-items:center;align-items:start;gap:22px;padding:24px 16px 60px}
  .empty{margin-top:80px;text-align:center;color:#a9b8c9;font-size:14px;line-height:1.7}
  @media print{
    body{background:#fff}
    .toolbar{display:none!important}
    .sheets{padding:0;gap:0;display:block}   /* al imprimir, una por página */
    .sheet{width:auto;min-height:auto;box-shadow:none;border-radius:0;padding:10mm 12mm;page-break-after:always}
    .sheet:last-child{page-break-after:auto}
  }
  @page{size:letter;margin:8mm}
</style>
</head>
<body>
<div class="toolbar">
  <strong>⎙ Guías imprimibles</strong>
  <label><input type="checkbox" data-sheet="perfil" checked> Perfil</label>
  <label><input type="checkbox" data-sheet="escaleta" checked> Escaleta</label>
  <label><input type="checkbox" data-sheet="camaras" checked> Cámaras</label>
  <label><input type="checkbox" data-sheet="checklist" checked> Checklist</label>
  <label><input type="checkbox" data-sheet="plano" checked> Plano del set</label>
  <label><input type="checkbox" data-sheet="iluminacion" checked> Plan de iluminación</label>
  <label><input type="checkbox" data-sheet="llamado" checked> Hoja de llamado</label>
  <label><input type="checkbox" data-sheet="cambios" checked> Registro de cambios</label>
  <label>Filas extra <input id="extra-rows" type="number" min="0" max="12" value="4"></label>
  <span class="hint">Se imprimen solo las hojas marcadas</span>
  <button id="print-btn">Imprimir / Guardar PDF</button>
</div>
<main class="sheets" id="sheets">
  <div class="empty">Abre un proyecto para generar sus guías de set.<br>Las hojas se llenan a mano en producción y después se capturan de regreso en la app.</div>
</main>

<script src="../shared/sheets.js"></script>
<script>
(() => {
  'use strict';
  const S = window.PTVSheets;
  let cfg = null;
  let projectName = '';

  function render() {
    if (!cfg) return;
    const box = document.querySelector('#sheets');
    const extra = Math.max(0, Math.min(12, Number(document.querySelector('#extra-rows').value) || 0));
    const wanted = [...document.querySelectorAll('[data-sheet]:checked')].map((c) => c.dataset.sheet);
    if (!wanted.length) { box.innerHTML = '<div class="empty">Marca al menos una hoja para imprimir.</div>'; return; }
    box.innerHTML = wanted.map((id, i) =>
      `<section class="sheet" style="display:flex;flex-direction:column">${S[id](cfg, projectName, { extraRows: extra })}${S.foot(i + 1, wanted.length)}</section>`
    ).join('');
  }

  document.querySelectorAll('[data-sheet]').forEach((c) => c.onchange = render);
  document.querySelector('#extra-rows').onchange = render;
  // El PDF se imprime desde el shell: se le mandan las hojas con sus estilos,
  // porque imprimir el iframe solo saca la parte visible (una pantalla).
  document.querySelector('#print-btn').onclick = async () => {
    let css = '';
    try { css = await (await fetch('../shared/sheets.css')).text(); } catch {}
    const html = [...document.querySelectorAll('.sheet')].map((el) => el.outerHTML).join('');
    if (!html) return;
    parent.postMessage({ type: 'producciontv:print-document', html, css }, '*');
  };

  window.addEventListener('message', (event) => {
    // El tema viaja del marco a la herramienta: son documentos distintos y
    // esta no hereda nada. Sin esto arrancaría siempre en claro.
    if (event.data?.type === 'producciontv:tema') {
      const t = event.data.tema;
      if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
      else delete document.documentElement.dataset.tema;
    }
    const data = event.data;
    if (data && data.type === 'producciontv:load-guias') {
      cfg = data.cfg || null;
      projectName = data.projectName || '';
      render();
    }
  });
})();
</script>
</body>
</html>
