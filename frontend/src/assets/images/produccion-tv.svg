<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Producción TV">
  <!-- PORTAFILTROS DE GELATINAS
       Tres gelatinas -ámbar, rosa y azul- montadas en su marco. Es la
       herramienta con la que un iluminador pinta una escena, y es de donde
       sale toda la paleta de la app.
       Plano y geométrico a propósito: el icono anterior era un render 3D de
       cámara de cuero y cromo que a 32 px en el Dock era una mancha café.
       Este se sigue leyendo a 16 px porque son tres barras y un marco. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFEEF3"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#fondo)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#1A1822" stroke-opacity=".10" stroke-width="4"/>

  <!-- Las tres gelatinas. El rosa va al centro: es el acento de la app. -->
  <g>
    <rect x="112" y="128" width="80" height="256" rx="14" fill="#FFA83A"/>
    <rect x="216" y="128" width="80" height="256" rx="14" fill="#F04E98"/>
    <rect x="320" y="128" width="80" height="256" rx="14" fill="#3D8BE0"/>
  </g>

  <!-- La luz que se cuela por ellas -->
  <rect x="112" y="128" width="288" height="256" rx="14" fill="url(#luz)" opacity=".55"/>

  <!-- El marco del portafiltros -->
  <rect x="112" y="128" width="288" height="256" rx="14" fill="none" stroke="#1A1822" stroke-opacity=".30" stroke-width="10"/>
</svg>
